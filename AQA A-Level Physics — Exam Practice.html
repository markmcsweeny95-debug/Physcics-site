<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AQA A-Level Physics — Exam Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1e2532;
    --border: #2a3341;
    --blue: #4f9cf9;
    --blue-dim: #1e3a5f;
    --green: #3fb950;
    --green-dim: #143d1f;
    --red: #f85149;
    --red-dim: #3d1a1a;
    --amber: #d29922;
    --text: #e6edf3;
    --text-muted: #7d8590;
    --text-dim: #4a5568;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── Layout ── */
  .app { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  /* ── Sidebar ── */
  .sidebar-header {
    padding: 20px 16px 14px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--blue);
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .sidebar-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .sidebar-stats {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat-box {
    background: var(--surface2);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .stat-val {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 500;
    color: var(--blue);
    line-height: 1;
  }
  .stat-lbl {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .nav-section-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    padding: 8px 16px 4px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 16px;
    cursor: pointer;
    transition: background 0.1s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    color: var(--text-muted);
    font-family: var(--sans);
    font-size: 13.5px;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--blue-dim); color: var(--blue); }
  .nav-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }
  .nav-item.active .nav-dot { background: var(--blue); }
  .nav-item.done .nav-dot { background: var(--green); }
  .nav-item.done { color: var(--text-muted); }
  .nav-count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  /* ── Main header ── */
  .main-header {
    padding: 24px 32px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topic-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .topic-heading {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .topic-meta {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* ── Questions ── */
  .questions-area {
    padding: 24px 32px 60px;
    max-width: 860px;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .question-card.correct { border-color: var(--green); }
  .question-card.wrong { border-color: var(--red); }

  .q-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .q-num {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    padding-top: 1px;
    flex-shrink: 0;
    min-width: 26px;
  }
  .q-text {
    font-size: 14.5px;
    color: var(--text);
    line-height: 1.65;
    flex: 1;
  }
  .q-marks {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--amber);
    flex-shrink: 0;
    background: rgba(210,153,34,0.1);
    padding: 2px 7px;
    border-radius: 4px;
  }

  .q-body { padding: 16px 20px 16px 58px; }

  /* MCQ */
  .mcq-options { display: flex; flex-direction: column; gap: 8px; }
  .mcq-opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    transition: border-color 0.1s, background 0.1s;
    font-size: 14px;
    color: var(--text-muted);
  }
  .mcq-opt:hover:not(.disabled) { border-color: var(--blue); color: var(--text); background: var(--blue-dim); }
  .mcq-opt.selected-correct { border-color: var(--green); background: var(--green-dim); color: var(--text); }
  .mcq-opt.selected-wrong { border-color: var(--red); background: var(--red-dim); color: var(--text); }
  .mcq-opt.reveal-correct { border-color: var(--green); color: var(--green); }
  .mcq-opt.disabled { cursor: default; pointer-events: none; }
  .opt-letter {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    flex-shrink: 0;
    padding-top: 1px;
  }
  .mcq-opt.selected-correct .opt-letter { color: var(--green); }
  .mcq-opt.selected-wrong .opt-letter { color: var(--red); }
  .mcq-opt.reveal-correct .opt-letter { color: var(--green); }

  /* Written / short answer */
  .answer-area {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 12px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    resize: vertical;
    min-height: 80px;
    transition: border-color 0.15s;
    line-height: 1.6;
  }
  .answer-area:focus { outline: none; border-color: var(--blue); }
  .answer-area.revealed { border-color: var(--border); }

  /* Formula / equation display */
  .formula {
    font-family: var(--mono);
    background: var(--surface2);
    border-left: 3px solid var(--blue);
    padding: 8px 14px;
    border-radius: 0 6px 6px 0;
    margin: 10px 0;
    font-size: 14px;
    color: var(--blue);
  }

  /* Mark scheme */
  .mark-scheme {
    margin-top: 14px;
    padding: 14px;
    background: var(--surface2);
    border-radius: 7px;
    border-left: 3px solid var(--green);
    display: none;
  }
  .mark-scheme.show { display: block; }
  .ms-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--green);
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .ms-point {
    display: flex;
    gap: 8px;
    font-size: 13.5px;
    color: var(--text-muted);
    margin-bottom: 5px;
    line-height: 1.5;
  }
  .ms-tick { color: var(--green); flex-shrink: 0; }

  /* Action row */
  .q-actions {
    padding: 0 20px 14px 58px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 7px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.1s;
  }
  .btn-primary {
    background: var(--blue);
    border-color: var(--blue);
    color: #0d1117;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary {
    background: transparent;
    color: var(--text-muted);
  }
  .btn-secondary:hover { background: var(--surface2); color: var(--text); }
  .btn-ghost {
    background: transparent;
    border-color: transparent;
    color: var(--text-dim);
    font-size: 12px;
  }
  .btn-ghost:hover { color: var(--text-muted); }

  /* Result badge */
  .result-badge {
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    display: none;
    align-items: center;
    gap: 6px;
  }
  .result-badge.correct { display: flex; background: var(--green-dim); color: var(--green); }
  .result-badge.wrong { display: flex; background: var(--red-dim); color: var(--red); }

  /* Progress bar */
  .progress-bar {
    height: 3px;
    background: var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .progress-fill {
    height: 100%;
    background: var(--blue);
    transition: width 0.4s ease;
  }

  /* Welcome screen */
  .welcome {
    padding: 60px 32px;
    max-width: 660px;
  }
  .welcome-tag {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--blue);
    letter-spacing: 0.1em;
    margin-bottom: 16px;
  }
  .welcome-h { font-size: 32px; font-weight: 600; color: var(--text); margin-bottom: 12px; line-height: 1.25; }
  .welcome-p { font-size: 15px; color: var(--text-muted); margin-bottom: 32px; line-height: 1.7; }
  .welcome-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 32px;
  }
  .welcome-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .wc-num { font-family: var(--mono); font-size: 22px; color: var(--blue); font-weight: 500; }
  .wc-lbl { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  .img-placeholder {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    margin: 10px 0;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Mobile */
  @media (max-width: 700px) {
    .sidebar { display: none; }
    .mobile-nav {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .mobile-nav-btn {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text-muted);
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      font-family: var(--sans);
    }
    .mobile-nav-btn.active { background: var(--blue-dim); color: var(--blue); border-color: var(--blue); }
    .questions-area { padding: 16px 16px 60px; }
    .main-header { padding: 16px 16px 14px; }
    .q-body { padding: 12px 16px; }
    .q-actions { padding: 0 16px 14px; }
    .welcome { padding: 32px 16px; }
    .welcome-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 701px) {
    .mobile-nav { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">AQA // A-LEVEL</div>
      <div class="sidebar-title">Physics Exam Practice</div>
    </div>
    <div class="sidebar-stats">
      <div class="stat-box">
        <div class="stat-val" id="stat-answered">0</div>
        <div class="stat-lbl">answered</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-score" style="color:var(--green)">—</div>
        <div class="stat-lbl">score</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- populated by JS -->
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="mobile-nav" id="mobile-nav"></div>

    <div id="content-area">
      <!-- Welcome or questions -->
    </div>
  </main>

</div>

<script>
// ═══════════════════════════════════════════════════════
// DATA — AQA A-Level Physics question bank
// ═══════════════════════════════════════════════════════
const topics = [
  {
    id: 'mechanics',
    title: 'Mechanics',
    subtitle: 'Forces, motion, energy and momentum',
    paper: 'Paper 1',
    questions: [
      {
        type: 'mcq',
        text: 'A car accelerates uniformly from rest to 20 m s⁻¹ in 8.0 s. What is the distance travelled during this time?',
        marks: 1,
        options: ['80 m', '160 m', '40 m', '320 m'],
        answer: 0,
        markscheme: ['Distance = ½(u+v)t = ½ × 20 × 8.0 = 80 m', 'Or using s = ut + ½at²: a = 2.5 m s⁻², s = ½ × 2.5 × 64 = 80 m']
      },
      {
        type: 'mcq',
        text: 'Which of the following is a vector quantity?',
        marks: 1,
        options: ['Kinetic energy', 'Power', 'Velocity', 'Temperature'],
        answer: 2,
        markscheme: ['Velocity has both magnitude and direction — it is a vector. The others are scalar quantities.']
      },
      {
        type: 'written',
        text: 'A ball is thrown horizontally from a cliff at 15 m s⁻¹. It lands 45 m from the base of the cliff. Calculate the height of the cliff. (g = 9.81 m s⁻²)',
        marks: 3,
        markscheme: [
          'Time of flight: horizontal: t = 45/15 = 3.0 s ✓',
          'Using s = ut + ½at²: h = 0 + ½ × 9.81 × 3.0² ✓',
          'h = 44.1 ≈ 44 m ✓ (accept 44–45 m)'
        ]
      },
      {
        type: 'written',
        text: 'A trolley of mass 2.0 kg moving at 4.0 m s⁻¹ collides with a stationary trolley of mass 3.0 kg. They stick together. Calculate the velocity of the combined trolleys after the collision and show that kinetic energy is not conserved.',
        marks: 4,
        markscheme: [
          'Apply conservation of momentum: 2.0 × 4.0 = (2.0 + 3.0) × v ✓',
          'v = 8.0 / 5.0 = 1.6 m s⁻¹ ✓',
          'KE before = ½ × 2.0 × 4.0² = 16 J',
          'KE after = ½ × 5.0 × 1.6² = 6.4 J ✓',
          'KE lost = 9.6 J — not conserved, so inelastic collision ✓'
        ]
      },
      {
        type: 'mcq',
        text: 'A force of 12 N acts on an object at 30° above the horizontal. What is the horizontal component of this force?',
        marks: 1,
        options: ['6.0 N', '10.4 N', '12 N', '13.9 N'],
        answer: 1,
        markscheme: ['Horizontal component = F cos θ = 12 × cos 30° = 12 × 0.866 = 10.4 N']
      },
      {
        type: 'written',
        text: 'Explain what is meant by the principle of conservation of momentum and state the condition under which it applies.',
        marks: 3,
        markscheme: [
          'The total momentum of a system remains constant ✓',
          '... provided no external resultant force acts on the system ✓',
          'Momentum is a vector quantity — direction must be considered ✓'
        ]
      },
      {
        type: 'mcq',
        text: 'An object of weight 50 N is on a smooth slope inclined at 25° to the horizontal. What is the component of weight acting along the slope (down the slope)?',
        marks: 1,
        options: ['45.3 N', '21.1 N', '50 N', '55.2 N'],
        answer: 1,
        markscheme: ['Component along slope = W sin θ = 50 × sin 25° = 50 × 0.423 = 21.1 N']
      },
      {
        type: 'written',
        text: 'A 5.0 kg box is pushed along a rough horizontal surface by a horizontal force of 30 N. The box accelerates at 2.0 m s⁻². Calculate the frictional force acting on the box and the coefficient of kinetic friction. (g = 9.81 m s⁻²)',
        marks: 4,
        markscheme: [
          'Resultant force = ma = 5.0 × 2.0 = 10 N ✓',
          'Friction = 30 − 10 = 20 N ✓',
          'Normal reaction N = mg = 5.0 × 9.81 = 49.05 N ✓',
          'μ = F/N = 20/49.05 = 0.41 ✓'
        ]
      },
      {
        type: 'mcq',
        text: 'What is the gravitational potential energy gained when a 70 kg person climbs a 10 m staircase? (g = 9.81 m s⁻²)',
        marks: 1,
        options: ['700 J', '6867 J', '68670 J', '343 J'],
        answer: 1,
        markscheme: ['GPE = mgh = 70 × 9.81 × 10 = 6867 J']
      },
      {
        type: 'written',
        text: 'Define the moment of a force and state the conditions for an object to be in equilibrium.',
        marks: 3,
        markscheme: [
          'Moment = force × perpendicular distance from the pivot ✓',
          'For equilibrium: resultant force is zero (no net linear force) ✓',
          '... AND resultant moment about any point is zero (sum of clockwise moments = sum of anticlockwise moments) ✓'
        ]
      }
    ]
  },
  {
    id: 'waves',
    title: 'Waves',
    subtitle: 'Wave properties, superposition, optics',
    paper: 'Paper 1',
    questions: [
      {
        type: 'mcq',
        text: 'The frequency of a wave is 500 Hz and its wavelength is 0.68 m. What is the wave speed?',
        marks: 1,
        options: ['735 m s⁻¹', '0.00136 m s⁻¹', '340 m s⁻¹', '1.36 × 10³ m s⁻¹'],
        answer: 2,
        markscheme: ['v = fλ = 500 × 0.68 = 340 m s⁻¹']
      },
      {
        type: 'written',
        text: 'Explain what is meant by the principle of superposition of waves and describe an observable effect it produces.',
        marks: 3,
        markscheme: [
          'When two waves meet, the resultant displacement equals the vector sum of individual displacements ✓',
          'Reference to interference pattern / stationary waves ✓',
          'Description: regions of constructive interference (antinodes/bright fringes) and destructive interference (nodes/dark fringes) ✓'
        ]
      },
      {
        type: 'mcq',
        text: 'In Young\'s double slit experiment, fringe spacing is 2.5 mm, slit separation is 0.4 mm, and the screen is 1.0 m away. What is the wavelength of the light used?',
        marks: 1,
        options: ['625 nm', '100 nm', '1000 nm', '400 nm'],
        answer: 0,
        markscheme: ['λ = wx/D = (2.5×10⁻³ × 0.4×10⁻³) / 1.0 = 1.0×10⁻⁶ / 1.0 = 1.0×10⁻⁶ m — wait, let\'s recalculate: λ = wd/L = (2.5×10⁻³ × 0.4×10⁻³)/1.0 = 625 nm... hmm. Actually: fringe spacing w = λL/d → λ = wd/L = (2.5e-3 × 0.4e-3)/1.0 = 1e-6 m. So 1000 nm. Accept any valid application of formula with correct working.', 'Actually λ = wd/L = (2.5×10⁻³ × 0.4×10⁻³)/1.0 = 1.0×10⁻⁶ m = 1000 nm. Answer C is correct.'],
        _correctOverride: 2
      },
      {
        type: 'written',
        text: 'Light of wavelength 590 nm is incident on a diffraction grating with 300 lines per mm. Calculate the angle of the second-order maximum.',
        marks: 3,
        markscheme: [
          'Grating spacing d = 1/300 mm = 3.33 × 10⁻⁶ m ✓',
          'nλ = d sin θ → 2 × 590×10⁻⁹ = 3.33×10⁻⁶ × sin θ ✓',
          'sin θ = 1.18×10⁻⁶ / 3.33×10⁻⁶ = 0.354 → θ = 20.7° ✓'
        ]
      },
      {
        type: 'mcq',
        text: 'Which statement about stationary waves is correct?',
        marks: 1,
        options: [
          'Energy is transferred along the wave',
          'All points between adjacent nodes vibrate in phase',
          'Nodes are points of maximum displacement',
          'The amplitude varies along the wave'
        ],
        answer: 3,
        markscheme: ['In a stationary wave, amplitude varies from zero (at nodes) to maximum (at antinodes). All other options describe transverse progressive waves incorrectly.']
      },
      {
        type: 'written',
        text: 'A string is fixed at both ends and resonates at its fundamental frequency when 60 cm long. Calculate the fundamental frequency if the wave speed on the string is 240 m s⁻¹.',
        marks: 2,
        markscheme: [
          'For fundamental: L = λ/2 → λ = 2L = 2 × 0.60 = 1.2 m ✓',
          'f = v/λ = 240/1.2 = 200 Hz ✓'
        ]
      },
      {
        type: 'mcq',
        text: 'Which of the following correctly describes the Doppler effect?',
        marks: 1,
        options: [
          'A change in speed of a wave when a source moves',
          'A change in observed frequency due to relative motion between source and observer',
          'The splitting of white light into a spectrum',
          'The bending of waves around obstacles'
        ],
        answer: 1,
        markscheme: ['The Doppler effect is the change in observed/received frequency due to relative motion between the source and the observer.']
      },
      {
        type: 'written',
        text: 'Describe how you would determine the wavelength of a microwave using a double-slit interference experiment. State what measurements you would take and how you would calculate wavelength.',
        marks: 4,
        markscheme: [
          'Set up microwave transmitter, two slits cut in metal sheet, receiver on far side ✓',
          'Move receiver across the interference pattern and record positions of maxima ✓',
          'Measure fringe spacing w (distance between adjacent maxima) ✓',
          'Measure slit separation d and distance to screen L ✓',
          'Calculate λ = wd/L ✓ (4 from 5)'
        ]
      },
      {
        type: 'mcq',
        text: 'Light travels from glass (n = 1.5) into air. What is the critical angle?',
        marks: 1,

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
const state = {
  currentTopic: null,
  answers: {}, // topicId_qIndex -> { submitted, correct, value, msVisible }
  totalAnswered: 0,
  totalCorrect: 0
};

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════

function totalQuestions() {
  return topics.reduce((s, t) => s + t.questions.length, 0);
}

function answeredInTopic(topicId) {
  const t = topics.find(x => x.id === topicId);
  if (!t) return 0;
  return t.questions.filter((_, i) => state.answers[`${topicId}_${i}`]?.submitted).length;
}

function buildSidebar() {
  const nav = document.getElementById('sidebar-nav');
  const mobile = document.getElementById('mobile-nav');
  nav.innerHTML = '';
  mobile.innerHTML = '';

  const papers = {};
  topics.forEach(t => { (papers[t.paper] = papers[t.paper] || []).push(t); });

  Object.entries(papers).forEach(([paper, pts]) => {
    const lbl = document.createElement('div');
    lbl.className = 'nav-section-label';
    lbl.textContent = paper;
    nav.appendChild(lbl);

    pts.forEach(t => {
      const done = answeredInTopic(t.id);
      const total = t.questions.length;
      const isDone = done === total;
      const isActive = state.currentTopic === t.id;

      const btn = document.createElement('button');
      btn.className = `nav-item${isActive ? ' active' : ''}${isDone ? ' done' : ''}`;
      btn.innerHTML = `<span class="nav-dot"></span>${t.title}<span class="nav-count">${done}/${total}</span>`;
      btn.onclick = () => loadTopic(t.id);
      nav.appendChild(btn);

      // Mobile
      const mb = document.createElement('button');
      mb.className = `mobile-nav-btn${isActive ? ' active' : ''}`;
      mb.textContent = t.title;
      mb.onclick = () => loadTopic(t.id);
      mobile.appendChild(mb);
    });
  });
}

function buildWelcome() {
  const area = document.getElementById('content-area');
  const total = totalQuestions();
  area.innerHTML = `
    <div class="welcome">
      <div class="welcome-tag">AQA A-LEVEL PHYSICS</div>
      <h1 class="welcome-h">Exam Question Practice</h1>
      <p class="welcome-p">Work through exam-style questions across all A-Level AQA Physics topics. Answer MCQs instantly, write your own answers for longer questions, then reveal the mark scheme to check your work.</p>
      <div class="welcome-grid">
        <div class="welcome-card"><div class="wc-num">${total}</div><div class="wc-lbl">exam questions</div></div>
        <div class="welcome-card"><div class="wc-num">${topics.length}</div><div class="wc-lbl">topic areas</div></div>
        <div class="welcome-card"><div class="wc-num">MCQ</div><div class="wc-lbl">+ written answers</div></div>
        <div class="welcome-card"><div class="wc-num">Mark<br>schemes</div><div class="wc-lbl">for every question</div></div>
      </div>
      <p style="color:var(--text-muted);font-size:13px;">← Select a topic from the menu to begin</p>
    </div>
  `;
}

function loadTopic(topicId) {
  state.currentTopic = topicId;
  buildSidebar();
  const topic = topics.find(t => t.id === topicId);
  if (!topic) return;

  const main = document.getElementById('content-area');
  main.innerHTML = `
    <div class="main-header">
      <div class="topic-label">TOPIC — ${topic.paper.toUpperCase()}</div>
      <div class="topic-heading">${topic.title}</div>
      <div class="topic-meta">${topic.subtitle} · ${topic.questions.length} questions</div>
    </div>
    <div class="questions-area" id="questions-container"></div>
  `;

  const container = document.getElementById('questions-container');

  topic.questions.forEach((q, i) => {
    const key = `${topicId}_${i}`;
    const saved = state.answers[key] || {};

    const card = document.createElement('div');
    card.className = `question-card${saved.correct === true ? ' correct' : saved.correct === false ? ' wrong' : ''}`;
    card.id = `qcard_${key}`;

    const corrIdx = q._correctOverride !== undefined ? q._correctOverride : q.answer;

    let bodyHtml = '';
    if (q.type === 'mcq') {
      bodyHtml = `<div class="mcq-options" id="opts_${key}">
        ${q.options.map((o, oi) => {
          let cls = 'mcq-opt';
          if (saved.submitted) {
            cls += ' disabled';
            if (oi === corrIdx) cls += ' reveal-correct';
            if (oi === saved.value && oi !== corrIdx) cls += ' selected-wrong';
            if (oi === saved.value && oi === corrIdx) cls = 'mcq-opt disabled selected-correct';
          }
          return `<div class="${cls}" data-i="${oi}" onclick="handleMCQ('${key}',${oi},${corrIdx})">
            <span class="opt-letter">${String.fromCharCode(65+oi)}</span>${o}
          </div>`;
        }).join('')}
      </div>`;
    } else {
      bodyHtml = `<textarea class="answer-area${saved.submitted ? ' revealed' : ''}" id="ans_${key}" placeholder="Write your answer here…" ${saved.submitted ? 'readonly' : ''}>${saved.value || ''}</textarea>`;
    }

    const msHtml = `<div class="mark-scheme${saved.msVisible ? ' show' : ''}" id="ms_${key}">
      <div class="ms-label">MARK SCHEME</div>
      ${q.markscheme.map(p => `<div class="ms-point"><span class="ms-tick">✓</span><span>${p}</span></div>`).join('')}
    </div>`;

    let actionsHtml = '';
    if (q.type === 'written') {
      if (!saved.submitted) {
        actionsHtml = `<button class="btn btn-primary" onclick="submitWritten('${key}')">Submit answer</button>
          <button class="btn btn-ghost" onclick="toggleMS('${key}')">Show mark scheme</button>`;
      } else {
        actionsHtml = `<button class="btn btn-secondary" onclick="toggleMS('${key}')">
          ${saved.msVisible ? 'Hide' : 'Show'} mark scheme
        </button>
        <button class="btn btn-ghost" onclick="resetQ('${key}','${topicId}',${i})">Reset</button>`;
      }
    } else {
      if (saved.submitted) {
        actionsHtml = `<button class="btn btn-secondary" onclick="toggleMS('${key}')">
          ${saved.msVisible ? 'Hide' : 'Show'} mark scheme
        </button>
        <button class="btn btn-ghost" onclick="resetQ('${key}','${topicId}',${i})">Reset</button>`;
      }
    }

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">Q${i+1}</div>
        <div class="q-text">${q.text}</div>
        <div class="q-marks">${q.marks} mark${q.marks > 1 ? 's' : ''}</div>
      </div>
      <div class="q-body">${bodyHtml}${msHtml}</div>
      ${actionsHtml ? `<div class="q-actions">${actionsHtml}</div>` : ''}
    `;
    container.appendChild(card);
  });

  updateStats();
  document.getElementById('main').scrollTo(0, 0);
}

function handleMCQ(key, chosen, correct) {
  if (state.answers[key]?.submitted) return;

  const isCorrect = chosen === correct;
  state.answers[key] = { submitted: true, correct: isCorrect, value: chosen, msVisible: !isCorrect };

  const card = document.getElementById(`qcard_${key}`);
  card.className = `question-card ${isCorrect ? 'correct' : 'wrong'}`;

  const opts = document.querySelectorAll(`#opts_${key} .mcq-opt`);
  opts.forEach((opt, oi) => {
    opt.classList.add('disabled');
    if (oi === correct) opt.classList.add('reveal-correct');
    if (oi === chosen && !isCorrect) opt.classList.add('selected-wrong');
    if (oi === chosen && isCorrect) { opt.classList.remove('reveal-correct'); opt.classList.add('selected-correct'); }
  });

  // Show MS if wrong
  if (!isCorrect) {
    const ms = document.getElementById(`ms_${key}`);
    if (ms) ms.classList.add('show');
  }

  // Add action buttons
  const topicId = key.split('_')[0];
  const qi = parseInt(key.split('_')[1]);
  let actions = card.querySelector('.q-actions');
  if (!actions) {
    actions = document.createElement('div');
    actions.className = 'q-actions';
    card.appendChild(actions);
  }
  actions.innerHTML = `
    <button class="btn btn-secondary" onclick="toggleMS('${key}')">
      ${!isCorrect ? 'Hide' : 'Show'} mark scheme
    </button>
    <button class="btn btn-ghost" onclick="resetQ('${key}','${topicId}',${qi})">Reset</button>
  `;

  updateStats();
  buildSidebar();
}

function submitWritten(key) {
  const ta = document.getElementById(`ans_${key}`);
  const val = ta ? ta.value.trim() : '';
  state.answers[key] = { submitted: true, correct: null, value: val, msVisible: true };
  if (ta) { ta.readOnly = true; ta.classList.add('revealed'); }

  const ms = document.getElementById(`ms_${key}`);
  if (ms) ms.classList.add('show');

  const topicId = key.split('_')[0];
  const qi = parseInt(key.split('_')[1]);

  const card = document.getElementById(`qcard_${key}`);
  let actions = card.querySelector('.q-actions');
  if (actions) {
    actions.innerHTML = `
      <button class="btn btn-secondary" onclick="toggleMS('${key}')">Hide mark scheme</button>
      <button class="btn btn-ghost" onclick="resetQ('${key}','${topicId}',${qi})">Reset</button>
    `;
  }

  updateStats();
  buildSidebar();
}

function toggleMS(key) {
  const ms = document.getElementById(`ms_${key}`);
  if (!ms) return;
  const visible = ms.classList.toggle('show');
  if (state.answers[key]) state.answers[key].msVisible = visible;

  // Update button text
  const card = document.getElementById(`qcard_${key}`);
  const btn = card?.querySelector('.q-actions .btn-secondary');
  if (btn) btn.textContent = visible ? 'Hide mark scheme' : 'Show mark scheme';
}

function resetQ(key, topicId, qi) {
  delete state.answers[key];
  // Re-render topic
  loadTopic(topicId);

  // Scroll to that card
  setTimeout(() => {
    const card = document.getElementById(`qcard_${key}`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function updateStats() {
  let total = 0, correct = 0;
  Object.values(state.answers).forEach(a => {
    if (a.submitted) { total++; if (a.correct === true) correct++; }
  });
  document.getElementById('stat-answered').textContent = total;
  const mcqAnswered = Object.values(state.answers).filter(a => a.submitted && a.correct !== null).length;
  document.getElementById('stat-score').textContent = mcqAnswered > 0
    ? Math.round((correct / mcqAnswered) * 100) + '%'
    : '—';

  const totalQ = totalQuestions();
  document.getElementById('progress-fill').style.width = (total / totalQ * 100) + '%';
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
buildSidebar();
buildWelcome();
</script>
</body>
</html>
